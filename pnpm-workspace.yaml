# Native/binary deps that must run their install scripts. agentOS needs
# better-sqlite3 (actor storage), isolated-vm (guest JS) and koffi (sidecar FFI);
# esbuild backs tsx and vitest.
allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  isolated-vm: true
  koffi: true
  protobufjs: true
