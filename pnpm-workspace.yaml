# esbuild backs tsx and vitest. Nothing in the runtime tree compiles from source
# any more: the agentOS/Rivet stack took better-sqlite3, isolated-vm and koffi
# with it, which is also why the Dockerfile no longer needs a C++ toolchain.
#
# @google/genai and protobufjs arrive transitively through pi-ai's multi-provider
# support. Their install scripts are optional and we do not use those providers,
# so they are denied explicitly rather than left to warn on every install.
allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false
